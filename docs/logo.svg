<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 132 132" width="132" height="132" role="img" aria-label="Aether" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="aether-base" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="30%" stop-color="#A855F7"/>
      <stop offset="55%" stop-color="#F0ABFC"/>
      <stop offset="78%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <radialGradient id="aether-pink" cx="30%" cy="24%" r="65%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F9A8D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aether-blue" cx="74%" cy="26%" r="65%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#93C5FD" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="aether-eye-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="aether-orb-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FB923C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#aether-orb-glow)">
    <circle cx="50" cy="50" r="46" fill="url(#aether-base)"/>
    <circle cx="50" cy="50" r="46" fill="url(#aether-pink)"/>
    <circle cx="50" cy="50" r="46" fill="url(#aether-blue)"/>
    <g filter="url(#aether-eye-glow)" fill="none" stroke="white" stroke-width="5.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 45 L36 35 L42 45" transform="rotate(10 36 40)"/>
      <path d="M46 45 L52 35 L58 45" transform="rotate(-10 52 40)"/>
    </g>
  </g>
</svg>
